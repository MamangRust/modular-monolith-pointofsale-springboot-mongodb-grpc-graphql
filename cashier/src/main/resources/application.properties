spring.application.name=cashier-service
spring.data.mongodb.uri=mongodb://${CASHIER_DB_HOST:localhost}:${CASHIER_DB_PORT:27017}/${CASHIER_DB_NAME:example_mongo_pointofsale}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9014

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9005}

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9011}
