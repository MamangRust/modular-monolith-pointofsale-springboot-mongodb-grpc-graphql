apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: pointofsale
data:
  APP_ENV: "kubernetes"
  DB_SEEDER: "false"
  APP_LOGGER: "production"

  # ── MongoDB: each service connects to its own DB namespace on the shared
  #    single-node replica set (`mongo` Service). Spring Data MongoDB reads the
  #    per-service <SVC>_DB_HOST / <SVC>_DB_PORT / <SVC>_DB_NAME variables. ──
  AUTH_DB_HOST: "mongo"
  AUTH_DB_PORT: "27017"
  AUTH_DB_NAME: "example_mongo_pointofsale"

  USER_DB_HOST: "mongo"
  USER_DB_PORT: "27017"
  USER_DB_NAME: "example_mongo_pointofsale"

  ROLE_DB_HOST: "mongo"
  ROLE_DB_PORT: "27017"
  ROLE_DB_NAME: "example_mongo_pointofsale"

  MERCHANT_DB_HOST: "mongo"
  MERCHANT_DB_PORT: "27017"
  MERCHANT_DB_NAME: "example_mongo_pointofsale"

  TRANSACTION_DB_HOST: "mongo"
  TRANSACTION_DB_PORT: "27017"
  TRANSACTION_DB_NAME: "example_mongo_pointofsale"

  CASHIER_DB_HOST: "mongo"
  CASHIER_DB_PORT: "27017"
  CASHIER_DB_NAME: "example_mongo_pointofsale"

  CATEGORY_DB_HOST: "mongo"
  CATEGORY_DB_PORT: "27017"
  CATEGORY_DB_NAME: "example_mongo_pointofsale"

  PRODUCT_DB_HOST: "mongo"
  PRODUCT_DB_PORT: "27017"
  PRODUCT_DB_NAME: "example_mongo_pointofsale"

  ORDER_DB_HOST: "mongo"
  ORDER_DB_PORT: "27017"
  ORDER_DB_NAME: "example_mongo_pointofsale"

  ORDER_ITEM_DB_HOST: "mongo"
  ORDER_ITEM_DB_PORT: "27017"
  ORDER_ITEM_DB_NAME: "example_mongo_pointofsale"

  # db-migration reads its own DB_MIGRATE_* variables.
  DB_MIGRATE_HOST: "mongo"
  DB_MIGRATE_PORT: "27017"
  DB_MIGRATE_NAME: "example_mongo_pointofsale"

  OTEL_ENDPOINT: "otel-collector.pointofsale.svc.cluster.local:4317"
  KAFKA_BROKERS: "kafka.pointofsale.svc.cluster.local:9092"

  # Fase 14 (K-6): client memakai SASL_SSL + SCRAM-SHA-256 ke broker produksi.
  # Kredensial + JAAS dari secret `app-secrets`; truststore JKS di-mount dari
  # secret `kafka-tls` (lihat catatan mount di tiap deployment / runbook).
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
  KAFKA_SSL_TRUSTSTORE_TYPE: "JKS"
  KAFKA_SSL_TRUSTSTORE_LOCATION: "/certs/kafka.truststore.jks"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_CLUSTER_ENABLED: "true"
  REDIS_CLUSTER_ENDPOINTS: "redis-cluster-0.redis-cluster-headless.pointofsale.svc.cluster.local:6379,redis-cluster-1.redis-cluster-headless.pointofsale.svc.cluster.local:6379,redis-cluster-2.redis-cluster-headless.pointofsale.svc.cluster.local:6379,redis-cluster-3.redis-cluster-headless.pointofsale.svc.cluster.local:6379,redis-cluster-4.redis-cluster-headless.pointofsale.svc.cluster.local:6379,redis-cluster-5.redis-cluster-headless.pointofsale.svc.cluster.local:6379"

  GRPC_USER_ADDR: user.pointofsale.svc.cluster.local:9011
  GRPC_AUTH_ADDR: auth.pointofsale.svc.cluster.local:9012
  GRPC_ROLE_ADDR: role.pointofsale.svc.cluster.local:9006
  GRPC_MERCHANT_ADDR: merchant.pointofsale.svc.cluster.local:9005
  GRPC_TRANSACTION_ADDR: transaction.pointofsale.svc.cluster.local:9009
  GRPC_CASHIER_ADDR: cashier.pointofsale.svc.cluster.local:9014
  GRPC_CATEGORY_ADDR: category.pointofsale.svc.cluster.local:9015
  GRPC_PRODUCT_ADDR: product.pointofsale.svc.cluster.local:9003
  GRPC_ORDER_ADDR: order.pointofsale.svc.cluster.local:9001
  GRPC_ORDER_ITEM_ADDR: order-item.pointofsale.svc.cluster.local:9016

  GRPC_USER_PORT: "9011"
  GRPC_AUTH_PORT: "9012"
  GRPC_ROLE_PORT: "9006"
  GRPC_MERCHANT_PORT: "9005"
  GRPC_TRANSACTION_PORT: "9009"
  GRPC_CASHIER_PORT: "9014"
  GRPC_CATEGORY_PORT: "9015"
  GRPC_PRODUCT_PORT: "9003"
  GRPC_ORDER_PORT: "9001"
  GRPC_ORDER_ITEM_PORT: "9016"

  SECRET_KEY: "yantopedia"
  DB_URL: "mongodb://mongo:27017/example_mongo_pointofsale"
